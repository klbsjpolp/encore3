onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild

# These groups only work on one shared release: vitest names @vitest/* as
# exact-version peers, and vite-plugin-pwa builds the service worker with
# workbox-build for the workbox-window client. Dependabot can bump one member
# alone and pnpm merely warns, so each group is declared once here, pinned
# exactly (a caret lets a fresh resolve move one member past the others).
# CI fails on any unmet peer (see ci.yml).
catalog:
  vitest: 5.0.1
  '@vitest/coverage-v8': 5.0.1
  workbox-build: 7.4.1
  workbox-window: 7.4.1

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y 6.10.2 is the latest release and its peer range
    # still stops at eslint 9, though it runs unchanged on eslint 10's flat
    # config: `pnpm lint` loads it on every run. Scoped to this one edge so any
    # other eslint peer mismatch still fails. Drop once a release widens it.
    eslint-plugin-jsx-a11y>eslint: '10'
