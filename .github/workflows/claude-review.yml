# Automated Claude Code review on every pull request targeting main.
# Requires the CLAUDE_CODE_OAUTH_TOKEN repository secret (generate it locally
# with `claude setup-token`). To make it a required (blocking) check, enable
# branch protection on main and mark the "review" check as required — but only
# after the secret exists, otherwise every merge is blocked.
name: Claude Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Skip draft PRs and Dependabot's automated bumps.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
